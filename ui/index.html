<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'">
<title>Plan review</title>
<style>
/* ---------------------------------------------------------------------------
   Tokens. One place to retune. Light is the base; dark is a separately chosen
   palette rather than an inversion.
   --------------------------------------------------------------------------- */
:root {
  --bg:        #faf9f7;
  --bg-sunk:   #f2efe9;
  --surface:   #ffffff;
  --surface-2: #f6f4f0;
  --ink:       #1c1b19;
  --ink-2:     #55514a;
  --ink-3:     #8a857c;
  --line:      #e6e1d8;
  --line-2:    #d2ccc0;
  --accent:    #9a6b12;
  --accent-2:  #b8842a;
  --accent-bg: #fdf6e8;
  --ok:        #3d7a34;
  --ok-bg:     #eff6ed;
  --del:       #a8372a;
  --del-bg:    #fcf0ee;
  --shadow-sm: 0 1px 2px rgba(28,27,25,.05);
  --shadow:    0 1px 2px rgba(28,27,25,.05), 0 6px 20px rgba(28,27,25,.07);
  --shadow-lg: 0 2px 4px rgba(28,27,25,.06), 0 16px 40px rgba(28,27,25,.12);
  --r:  10px;
  --r-sm: 7px;
  --f: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2,.6,.3,1);
  /* The width every chrome element aligns to. On a 34" display the header and
     the action bar were full-bleed while the plan stayed centred, so the view
     switcher ended up two thousand pixels from the text it acted on. */
  --content: 1360px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:        #101113;
    --bg-sunk:   #0a0b0c;
    --surface:   #191b1f;
    --surface-2: #202329;
    --ink:       #ebe8e3;
    --ink-2:     #a7a29a;
    --ink-3:     #74706a;
    --line:      #292c33;
    --line-2:    #3a3e46;
    --accent:    #e0ab52;
    --accent-2:  #f0c274;
    --accent-bg: rgba(224,171,82,.10);
    --ok:        #8cc47a;
    --ok-bg:     rgba(140,196,122,.12);
    --del:       #ef8b7a;
    --del-bg:    rgba(239,139,122,.13);
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    --shadow:    0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
    --shadow-lg: 0 2px 4px rgba(0,0,0,.5), 0 16px 40px rgba(0,0,0,.45);
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f);
  font-size: 16.5px;
  line-height: 1.68;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
::selection { background: var(--accent-bg); }

/* ---------------------------------------------------------- header ------- */
.top {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 16px;
  /* Full-bleed background and border, content aligned to the plan below. */
  padding: 0 max(28px, calc((100% - var(--content)) / 2)); height: 56px;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--line);
}
.brand {
  display: flex; align-items: baseline; gap: 9px;
  font-size: 14px; font-weight: 600; letter-spacing: -.01em; margin: 0;
  white-space: nowrap;
}
.brand .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent); align-self: center; flex: none;
}
.cwd {
  font-family: var(--mono); font-size: 11.5px; color: var(--ink-3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  flex: 1; min-width: 0;
}
.count {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 12.5px; font-weight: 500; color: var(--ink-2);
  font-variant-numeric: tabular-nums;
  padding: 5px 11px; border: 1px solid var(--line-2); border-radius: 999px;
  background: var(--surface); white-space: nowrap;
  cursor: default; transition: all .16s var(--ease);
}
.count[data-has="1"] {
  color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent);
  background: var(--accent-bg); cursor: pointer;
}
.count[data-has="1"]:hover { border-color: var(--accent); }

.seg {
  display: inline-flex; flex: none; padding: 2px; gap: 2px;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px;
}
.seg[hidden] { display: none; }
.seg button {
  font: 500 12px/1 var(--f); color: var(--ink-2);
  padding: 6px 11px; border: 0; border-radius: 6px; background: none;
  cursor: pointer; transition: all .16s var(--ease); white-space: nowrap;
}
.seg button:hover { color: var(--ink); }
.seg button.on {
  background: var(--surface); color: var(--ink);
  box-shadow: var(--shadow-sm); font-weight: 600;
}

/* --------------------------------------------------------- revision ------ */
.revbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  font-size: 12.5px; color: var(--ink-2);
  margin: 0 0 26px; padding: 11px 14px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r);
}
.revbar[hidden] { display: none; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
  font-variant-numeric: tabular-nums;
}
.pill.changed { background: var(--accent-bg); color: var(--accent); }
.pill.added   { background: var(--ok-bg);     color: var(--ok); }
.pill.removed { background: var(--del-bg); color: var(--del); }

.doc.marking .blk.d-changed .body { border-left: 2px solid var(--accent); }
.doc.marking .blk.d-added   .body { border-left: 2px solid var(--ok); }
.tag { display: none; }
.doc.marking .tag {
  display: block;
  position: absolute; right: 100%; top: 7px; margin-right: 10px;
  font: 600 9.5px/1 var(--f); letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-3); white-space: nowrap;
}
.doc ins {
  background: var(--ok-bg); color: var(--ok);
  text-decoration: none; border-radius: 3px; padding: .05em .12em;
}
.doc del {
  background: var(--del-bg); color: var(--del);
  text-decoration: line-through; border-radius: 3px; padding: .05em .12em;
  text-decoration-thickness: 1px;
}
.gap {
  display: flex; align-items: center; gap: 12px;
  font-size: 11.5px; color: var(--ink-3);
  margin: 6px 0 6px 34px; padding: 3px 0;
}
.gap::before, .gap::after {
  content: ""; flex: 1; height: 1px; background: var(--line);
}
.dropped {
  margin: 8px 0 8px 34px; padding: 9px 12px;
  border: 1px dashed var(--line-2); border-radius: var(--r-sm);
  font-size: 12.5px; color: var(--ink-3);
  background: var(--bg-sunk);
}
.dropped b { font-weight: 600; color: var(--ink-2); }

/* ---------------------------------------------------------- layout ------- */
.wrap {
  position: relative;
  display: grid; grid-template-columns: 1fr; gap: 0;
  padding: 44px 28px 220px;
  margin: 0 auto; max-width: var(--content);
}
.doc { min-width: 0; max-width: 68ch; margin: 0 auto; }
.rail { display: none; position: relative; }
.rail .card { margin-bottom: 0; }

@media (min-width: 1120px) {
  .wrap {
    grid-template-columns: minmax(0, 68ch) 336px;
    column-gap: 68px; justify-content: center;
  }
  .doc { margin: 0; }
  .rail { display: block; }
}

/* Side-by-side view -------------------------------------------------------
   The split needs the full window, so it drops the reading column and the
   comment rail. These selectors are more specific than the ones above, so
   they win wherever they are in the file -- the rail/breakpoint desync that
   bit twice cannot come back through this rule. Hiding the rail also flips
   isWide() to false on its own, which is why comments move inline here with
   no extra logic. */
/* Two columns want roughly twice the room, and on a wide display there is
   room to give. Prose inside the cells is capped separately, below. */
body.splitview { --content: 2100px; }
body.splitview .wrap { grid-template-columns: 1fr; }
body.splitview .doc { max-width: none; margin: 0; }
body.splitview .rail { display: none; }
body.splitview .inline-slot { display: block; }

.split { display: none; }
body.splitview .split { display: block; }
.split {
  border: 1px solid var(--line); border-radius: var(--r);
  background: var(--surface); overflow: hidden; margin-top: 4px;
}
.shead {
  display: grid; grid-template-columns: 1fr 1fr;
  position: sticky; top: 0; z-index: 3;
  background: var(--surface-2); border-bottom: 1px solid var(--line-2);
  font: 600 10px/1 var(--f); letter-spacing: .07em; text-transform: uppercase;
  color: var(--ink-3);
}
.shead span { padding: 9px 16px; }
.shead span + span { border-left: 1px solid var(--line); }
.srow { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--line); }
/* Two columns of a plan do not fit a narrow window. Stack them rather than
   squeezing both into something neither is readable in -- old above new keeps
   the same reading order the side-by-side has. */
@media (max-width: 900px) {
  .shead, .srow { grid-template-columns: 1fr; }
  .scell + .scell { border-left: 0; border-top: 1px solid var(--line-2); }
  .shead span + span { border-left: 0; border-top: 1px solid var(--line-2); }
}
.srow:last-child { border-bottom: 0; }
.scell { padding: 6px 12px; min-width: 0; overflow-x: auto; }
.scell + .scell { border-left: 1px solid var(--line); }
.scell > :last-child { margin-bottom: 0; }
/* A cell on an ultrawide monitor is over a thousand pixels across, which is
   about 130 characters of prose -- unreadable. Cap the running text; tables,
   code and diagrams keep the whole cell, since they are the things that
   actually benefit from it. */
.split p, .split li { max-width: 82ch; }
.srow.s-changed .sleft, .srow.s-removed .sleft { background: var(--del-bg); }
.srow.s-changed .sright, .srow.s-added .sright { background: var(--ok-bg); }
.scell.sempty { background: var(--bg-sunk); }
/* The status bar on the block stays -- it marks the content edge the same way
   it does in every other view. The EDITED/NEW tag does not: it is positioned
   outside its block, so inside a cell it is clipped to a one-pixel sliver.
   This selector has to outrank `.doc.marking .tag`, which is why it repeats
   the qualifier rather than being a bare `.split` rule. */
.doc.marking .split .tag { display: none; }
/* Match the right-hand column's indent, which comes from the block's own
   gutter plus its body padding, so the two sides line up line for line. */
.split .old { margin: 0 0 0 34px; padding: 4px 12px 4px 10px; color: var(--ink-2); }
.split .old > :last-child { margin-bottom: 0; }
.split .old.struct { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; }

/* Curved hairlines tying each comment to the block it annotates. */
#leaders {
  position: absolute; inset: 0; pointer-events: none; z-index: 1;
  overflow: visible;
}
#leaders path {
  fill: none; stroke: var(--line-2); stroke-width: 1.5;
  stroke-linecap: round; opacity: .85;
  transition: stroke .18s var(--ease);
}
#leaders path.lit { stroke: var(--accent); opacity: 1; stroke-width: 2; }

/* ------------------------------------------------------------ intro ------ */
.intro {
  display: flex; align-items: center; gap: 9px;
  font-size: 13px; color: var(--ink-3);
  margin: 0 0 30px; padding-left: 2px;
  transition: opacity .35s var(--ease);
}
.intro[hidden] { display: none; }
.intro .plus {
  display: inline-flex; align-items: center; justify-content: center;
  width: 19px; height: 19px; border-radius: 6px; flex: none;
  border: 1px solid var(--line-2); color: var(--ink-3);
  font-size: 13px; line-height: 1;
}

/* ------------------------------------------------------------ blocks ----- */
.blk { position: relative; padding-left: 34px; margin-bottom: 1px; z-index: 2; }
.blk .body {
  padding: 4px 12px 4px 10px;
  border-left: 2px solid transparent;
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
  transition: background .18s var(--ease), border-color .18s var(--ease);
}
.blk .body > *:first-child { margin-top: 0; }
.blk .body > *:last-child  { margin-bottom: 0; }
.blk:hover .body { background: var(--surface-2); }
.blk.has-note .body { border-left-color: var(--accent); background: var(--accent-bg); }
.blk.lit .body {
  background: var(--accent-bg);
  border-left-color: var(--accent);
}

.add {
  position: absolute; left: 0; top: 6px;
  width: 24px; height: 24px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--line-2); border-radius: var(--r-sm);
  background: var(--surface); color: var(--ink-3);
  font: 400 15px/1 var(--f); cursor: pointer;
  opacity: 0; transform: scale(.9);
  box-shadow: var(--shadow-sm);
  transition: opacity .16s var(--ease), transform .16s var(--ease),
              color .16s var(--ease), border-color .16s var(--ease);
}
.blk:hover .add { opacity: 1; transform: scale(1); }
.add:focus-visible { opacity: 1; transform: scale(1); }
.add:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-bg); }
.blk.has-note .add { display: none; }

.marker {
  position: absolute; left: 0; top: 6px;
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--r-sm); background: var(--accent); color: var(--bg);
  font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums;
  cursor: pointer; box-shadow: var(--shadow-sm);
  transition: transform .16s var(--ease);
}
.marker:hover { transform: scale(1.08); }

/* -------------------------------------------------------- markdown ------- */
.doc h1, .doc h2, .doc h3 { letter-spacing: -.018em; font-weight: 640; line-height: 1.28; }
.doc h1 { font-size: 30px; margin: 0 0 6px; letter-spacing: -.026em; }
.doc h2 {
  font-size: 20px; margin: 38px 0 6px; padding-top: 2px;
}
.doc h3 { font-size: 16.5px; margin: 26px 0 3px; color: var(--ink); }
.doc p  { margin: 0 0 15px; }
.doc ul, .doc ol { margin: 0 0 15px; padding-left: 26px; }
.doc li { margin: 4px 0; }
.doc li::marker { color: var(--ink-3); }
.doc ul ul, .doc ol ol, .doc ul ol, .doc ol ul { margin: 4px 0 2px; }
.doc blockquote {
  margin: 0 0 15px; padding: 3px 0 3px 16px;
  border-left: 2px solid var(--line-2); color: var(--ink-2);
}
.doc hr { border: 0; border-top: 1px solid var(--line); margin: 32px 0; }
.doc code {
  font-family: var(--mono); font-size: .855em;
  background: var(--surface-2); border: 1px solid var(--line);
  padding: .12em .3em; border-radius: 5px; white-space: nowrap;
}
.doc pre {
  font-family: var(--mono); font-size: 12.5px; line-height: 1.6;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--r); padding: 14px 16px; margin: 0 0 15px;
  overflow-x: auto;
}
.doc pre code { background: none; border: 0; padding: 0; font-size: inherit; white-space: pre; }

/* Code blocks -------------------------------------------------------------
   The language label sits on the block rather than inside it, so it never
   shifts the code by a line or gets selected when you copy. */
.doc .codeblock { position: relative; margin: 0 0 15px; }
.doc .codeblock pre { margin: 0; }
.doc .codeblock .lang {
  position: absolute; top: 0; right: 0;
  font: 600 9.5px/1 var(--f); letter-spacing: .07em; text-transform: uppercase;
  color: var(--ink-3); background: var(--surface-2);
  padding: 6px 9px; border-radius: 0 var(--r) 0 var(--r-sm);
  pointer-events: none; user-select: none;
}
.doc .codeblock .note {
  font-size: 12px; color: var(--ink-2); background: var(--accent-bg);
  border: 1px solid var(--line); border-bottom: 0;
  border-radius: var(--r) var(--r) 0 0; padding: 7px 12px; margin: 0;
}
.doc .codeblock .note + pre { border-radius: 0 0 var(--r) var(--r); }

/* One hue per token class, all pulled from the existing palette so code does
   not become the loudest thing on a page whose job is reading prose. */
.doc .t-k { color: var(--accent); font-weight: 600; }
.doc .t-s { color: var(--ok); }
.doc .t-c { color: var(--ink-3); font-style: italic; }
.doc .t-n { color: var(--accent-2); }

/* Mermaid diagrams --------------------------------------------------------
   Every colour lives here rather than in a fill attribute, so diagrams follow
   the theme for free and the generated SVG carries geometry only. */
.doc .diagram {
  margin: 0 0 15px; padding: 16px 14px; overflow-x: auto;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--r); text-align: center;
}
.doc .diagram svg { max-width: 100%; height: auto; font-family: var(--f); }
.mnode { fill: var(--surface); stroke: var(--line-2); stroke-width: 1.2px; }
.mnote { fill: var(--accent-bg); stroke: var(--accent-2); stroke-width: 1px; }
.mtext { fill: var(--ink); font-size: 12.5px; }
.medge { stroke: var(--ink-3); stroke-width: 1.3px; fill: none; }
.medge.dash { stroke-dasharray: 4 3; }
.mlife { stroke: var(--line-2); stroke-width: 1px; stroke-dasharray: 3 4; }
.marrow { fill: var(--ink-3); }
.mlabelbg { fill: var(--surface-2); }
.mlabel { fill: var(--ink-2); font-size: 11px; }
.doc table {
  border-collapse: collapse; width: 100%; margin: 0 0 15px; font-size: 14px;
  display: block; overflow-x: auto;
}
.doc th, .doc td {
  border-bottom: 1px solid var(--line); padding: 9px 12px;
  text-align: left; vertical-align: top;
}
.doc thead th {
  background: var(--surface-2); font-weight: 600; font-size: 12.5px;
  letter-spacing: .02em; text-transform: uppercase; color: var(--ink-2);
  border-bottom: 1px solid var(--line-2);
}
.doc tbody tr:last-child td { border-bottom: 0; }
.doc strong { font-weight: 645; }

/* ---------------------------------------------------------- comments ----- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 13px 14px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow .18s var(--ease), border-color .18s var(--ease),
              transform .18s var(--ease);
  animation: rise .22s var(--ease) both;
}
@keyframes rise { from { opacity: 0; transform: translateY(4px); } }
.card:hover { box-shadow: var(--shadow); border-color: var(--line-2); }
.card.lit { border-color: var(--accent); box-shadow: var(--shadow); }
.card .quote {
  display: flex; align-items: flex-start; gap: 8px;
  font-size: 11.5px; line-height: 1.45; color: var(--ink-3);
  margin-bottom: 9px; cursor: pointer;
}
.card .num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 17px; height: 17px; border-radius: 5px; flex: none; margin-top: 1px;
  background: var(--accent); color: var(--bg);
  font-size: 10px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.card .qtext {
  overflow: hidden; display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.card .text {
  font-size: 13.5px; line-height: 1.58; color: var(--ink);
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.card .acts {
  margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line);
  display: flex; gap: 14px; opacity: 0; transition: opacity .16s var(--ease);
}
.card:hover .acts, .card:focus-within .acts { opacity: 1; }
.linkbtn {
  background: none; border: 0; padding: 0; cursor: pointer;
  font: 500 12px/1 var(--f); color: var(--ink-3);
  transition: color .14s var(--ease);
}
.linkbtn:hover { color: var(--accent); }
.linkbtn.danger:hover { color: #c0392b; }
@media (prefers-color-scheme: dark) { .linkbtn.danger:hover { color: #ef7c6b; } }

/* --------------------------------------------------------- composer ------ */
.composer { border-color: var(--accent); box-shadow: var(--shadow); }
textarea {
  display: block; width: 100%; resize: none;
  font: 400 13.5px/1.58 var(--f); color: var(--ink);
  background: transparent; border: 0; padding: 0; outline: none;
  min-height: 62px;
}
textarea::placeholder { color: var(--ink-3); }
.composer .row {
  display: flex; gap: 10px; align-items: center;
  margin-top: 11px; padding-top: 10px; border-top: 1px solid var(--line);
}
.kbd {
  font: 400 10.5px/1 var(--mono); color: var(--ink-3); margin-left: auto;
  border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px;
}

.inline-slot { margin: 10px 0 16px 34px; }
.inline-slot .card { margin-bottom: 9px; }
@media (min-width: 1120px) { .inline-slot { display: none; } }

/* ---------------------------------------------------------- buttons ------ */
button { font-family: var(--f); }
.btn {
  font-size: 13px; font-weight: 550; letter-spacing: -.005em;
  padding: 9px 15px; border-radius: var(--r-sm);
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
  cursor: pointer; white-space: nowrap;
  transition: all .16s var(--ease);
}
.btn:hover:not(:disabled) { border-color: var(--ink-3); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.primary { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.07); }
.btn.warn {
  background: var(--accent); border-color: var(--accent); color: var(--bg);
  font-weight: 600;
}
.btn.warn:hover:not(:disabled) { filter: brightness(1.08); border-color: var(--accent); }
.btn.quiet { background: transparent; border-color: var(--line-2); color: var(--ink-2); }
.btn.quiet:hover:not(:disabled) { color: var(--ink); border-color: var(--ink-3); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.small { font-size: 12px; padding: 6px 11px; }
@media (prefers-color-scheme: dark) { .btn.primary { color: #0f1113; } }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ----------------------------------------------------------- footer ------ */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  border-top: 1px solid var(--line);
  box-shadow: 0 -1px 0 rgba(0,0,0,.02), 0 -12px 32px rgba(28,27,25,.05);
}
@media (prefers-color-scheme: dark) {
  .bar { box-shadow: 0 -12px 32px rgba(0,0,0,.35); }
}

/* The warning lives inside the bar rather than floating above it, and its
   space is reserved so appearing does not shove the whole page. */
.notice {
  display: flex; align-items: flex-start; gap: 9px;
  max-width: var(--content); margin: 0 auto; padding: 11px 28px 0;
  font-size: 12.5px; line-height: 1.5; color: var(--ink-2);
}
.notice[hidden] { display: none; }
.notice .ico {
  display: inline-flex; align-items: center; justify-content: center;
  width: 16px; height: 16px; border-radius: 50%; flex: none; margin-top: 1px;
  background: var(--accent); color: var(--bg);
  font: 700 10px/1 var(--f);
}
.notice b { color: var(--ink); font-weight: 640; }

.bar-inner {
  display: flex; align-items: flex-end; gap: 18px;
  max-width: var(--content); margin: 0 auto; padding: 14px 28px 16px;
}
.notes-wrap {
  flex: 1; min-width: 0;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); padding: 10px 13px;
  transition: border-color .16s var(--ease), box-shadow .16s var(--ease);
}
.notes-wrap:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-bg);
}
.notes-wrap textarea {
  min-height: 21px; max-height: 168px; overflow-y: auto; font-size: 13.5px;
}

.actions { display: flex; align-items: center; gap: 16px; flex: none; }
.summary {
  font-size: 12px; color: var(--ink-3); white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.summary.armed { color: var(--accent); font-weight: 550; }
.btns { display: flex; gap: 9px; align-items: center; }

.btn .hint {
  font: 400 10px/1 var(--mono); opacity: .55; margin-left: 7px;
}
.btn:disabled .hint { display: none; }

#submit-error {
  display: flex; align-items: flex-start; gap: 9px;
  max-width: var(--content); margin: 0 auto; padding: 12px 28px 0;
  font-size: 12.5px; line-height: 1.5; color: var(--ink);
}
#submit-error::before {
  content: "!"; display: inline-flex; align-items: center; justify-content: center;
  width: 16px; height: 16px; border-radius: 50%; flex: none; margin-top: 1px;
  background: #c0392b; color: #fff; font: 700 10px/1 var(--f);
}

/* ------------------------------------------------------------- done ------ */
.done { max-width: 420px; margin: 20vh auto; text-align: center; padding: 0 28px; }
.done .mark {
  width: 46px; height: 46px; margin: 0 auto 20px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; animation: pop .3s var(--ease) both;
}
.done .mark.ok   { background: var(--ok-bg); color: var(--ok); }
.done .mark.back { background: var(--accent-bg); color: var(--accent); }
@keyframes pop { from { opacity: 0; transform: scale(.85); } }
.done h2 { font-size: 19px; font-weight: 640; margin: 0 0 9px; letter-spacing: -.015em; }
.done p { color: var(--ink-2); font-size: 14px; margin: 0; line-height: 1.6; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<!--PLANTOR_DATA-->

<div id="app">
  <header class="top">
    <h1 class="brand"><span class="dot"></span>Plan review</h1>
    <span class="cwd" id="cwd"></span>
    <div class="seg" id="viewtoggle" role="group" aria-label="View" hidden>
      <button type="button" data-view="changes" class="on"
              title="Only what changed, unchanged sections collapsed">Changes</button>
      <button type="button" data-view="fulldiff"
              title="The whole plan with changes marked inline">Full diff</button>
      <button type="button" data-view="split"
              title="Side by side: the previous plan on the left, this one on the right">Split</button>
      <button type="button" data-view="plan"
              title="The plan as written, no diff marks">Plan</button>
    </div>
    <button class="count" id="count" type="button" aria-live="polite" data-has="0"
            title="Jump to the next comment">no comments</button>
  </header>

  <div class="wrap">
    <svg id="leaders" aria-hidden="true"></svg>
    <main class="doc" id="doc" aria-label="Plan"></main>
    <aside class="rail" id="rail" aria-label="Comments"></aside>
  </div>

  <footer class="bar">
    <div class="notice" id="notice" hidden>
      <span class="ico" aria-hidden="true">!</span>
      <span id="notice-text"></span>
    </div>
    <div class="bar-inner">
      <div class="notes-wrap">
        <textarea id="notes" rows="1" placeholder="Add an overall note…"
                  aria-label="Overall notes"></textarea>
      </div>
      <div class="actions">
        <span class="summary" id="summary">Nothing to send yet</span>
        <div class="btns">
          <button class="btn" id="reject" disabled
                  title="Add a comment or a note first">
            Request changes<span class="hint">⌘↵</span>
          </button>
          <button class="btn primary" id="approve">Approve</button>
        </div>
      </div>
    </div>
  </footer>
</div>

<!-- Pure markdown + diff functions. No DOM access, so tests/test_markdown.js
     can evaluate this block standalone under node. Keep it free of
     document/window references apart from the export at the bottom. -->
<script id="plantor-md">
(function (root) {
  "use strict";

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // Inline formatting, built by splitting on code spans and escaping each
  // piece independently. There is deliberately no placeholder sentinel: any
  // sentinel is a value the plan text could itself contain, which silently
  // corrupts output when it collides.
  function inline(text) {
    return String(text).split(/(`[^`]+`)/).map(function (part) {
      if (part.length > 1 && part.charAt(0) === "`" && part.charAt(part.length - 1) === "`") {
        return "<code>" + esc(part.slice(1, -1)) + "</code>";
      }
      var s = esc(part);
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>");
      // Links render as inert text: label plus target. Nothing on this page is
      // clickable to an external origin.
      s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, "$1 ($2)");
      return s;
    }).join("");
  }

  // Strip markdown for on-screen quoting and for the short anchor sent to
  // Claude. Never applied to anything that must stay verbatim.
  function plain(s) {
    return String(s)
      .replace(/`([^`]+)`/g, "$1")
      .replace(/\*\*([^*]+)\*\*/g, "$1")
      .replace(/(^|[^*])\*([^*]+)\*/g, "$1$2")
      .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
      .replace(/^#{1,6}\s+/, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  var ITEM = /^(\s*)([-*+]|\d+\.)\s+(.*)$/;

  // Recursive list parsing. A deeper-indented item becomes a nested list inside
  // its parent <li> rather than a flattened sibling -- flattening destroyed both
  // the hierarchy and the ordering of sub-steps, which is precisely what a plan
  // reviewer needs to see.
  function parseList(lines, start, indent) {
    var items = [];
    var i = start;
    while (i < lines.length) {
      var m = ITEM.exec(lines[i]);
      if (!m || m[1].length < indent) break;

      if (m[1].length > indent) {
        var nested = parseList(lines, i, m[1].length);
        if (items.length) items[items.length - 1].children.push(nested.html);
        i = nested.next;
        continue;
      }

      var item = { text: m[3], children: [] };
      items.push(item);
      i++;

      // Continuation lines: indented, and not themselves list items.
      while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !ITEM.test(lines[i])) {
        item.text += " " + lines[i].trim();
        i++;
      }
    }

    var ordered = items.length && /^\s*\d+\./.test(lines[start]);
    var tag = ordered ? "ol" : "ul";
    var html = "<" + tag + ">";
    var text = [];
    items.forEach(function (it) {
      html += "<li>" + inline(it.text) + it.children.join("") + "</li>";
      text.push(it.text);
    });
    html += "</" + tag + ">";
    return { html: html, next: i, text: text.join(" ") };
  }

  // -------------------------------------------------------------------------
  // Syntax highlighting
  //
  // Hand-rolled, because a highlighter is a dependency and dependencies are
  // exactly what this project refuses to have. It tokenises the RAW source and
  // escapes each token individually, so escaping cannot be skipped for a piece
  // that happened to match a pattern -- every path out of here runs through
  // esc(). The languages are the ones plans actually contain; anything else
  // falls through to a generic mode that still marks strings and numbers.
  // -------------------------------------------------------------------------

  var KEYWORDS = {
    python: "and as assert async await break class continue def del elif else " +
            "except False finally for from global if import in is lambda None " +
            "nonlocal not or pass raise return self True try while with yield",
    js: "async await break case catch class const continue default delete do " +
        "else export extends finally for function if import in instanceof let " +
        "new of return static super switch this throw try typeof var void " +
        "while yield true false null",
    bash: "case cd do done echo elif else esac exit export fi for function if " +
          "in local read readonly return set shift source then unset until while",
    json: "true false null"
  };

  function langConfig(lang) {
    var l = String(lang || "").toLowerCase();
    if (l === "py" || l === "python") return { kw: KEYWORDS.python, line: "#", tri: true };
    if (/^(js|jsx|ts|tsx|javascript|typescript)$/.test(l))
      return { kw: KEYWORDS.js, line: "//", block: true, tick: true };
    if (/^(sh|bash|shell|zsh|console|shellsession)$/.test(l))
      return { kw: KEYWORDS.bash, line: "#" };
    if (l === "json") return { kw: KEYWORDS.json };
    if (/^(yaml|yml|toml|ini|conf|dockerfile|makefile)$/.test(l)) return { kw: "", line: "#" };
    return { kw: "", line: "#", block: true };
  }

  function reEsc(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

  function tokenRe(cfg) {
    var parts = [];
    if (cfg.tri) parts.push('"""[\\s\\S]*?"""', "'''[\\s\\S]*?'''");
    if (cfg.block) parts.push("/\\*[\\s\\S]*?\\*/");
    if (cfg.line) parts.push(reEsc(cfg.line) + "[^\\n]*");
    parts.push('"(?:\\\\.|[^"\\\\\\n])*"', "'(?:\\\\.|[^'\\\\\\n])*'");
    if (cfg.tick) parts.push("`(?:\\\\.|[^`\\\\])*`");
    parts.push("\\b\\d[\\w.]*", "[A-Za-z_$][\\w$]*");
    return new RegExp(parts.join("|"), "g");
  }

  function highlight(src, lang) {
    var cfg = langConfig(lang);
    var kw = Object.create(null);
    String(cfg.kw || "").split(" ").forEach(function (w) { if (w) kw[w] = true; });

    var s = String(src), re = tokenRe(cfg), out = "", last = 0, m;
    while ((m = re.exec(s)) !== null) {
      if (!m[0].length) { re.lastIndex++; continue; }
      if (m.index > last) out += esc(s.slice(last, m.index));
      var t = m[0], c0 = t.charAt(0), cls = "";
      if (t.slice(0, 2) === "/*") cls = "t-c";
      else if (cfg.line && t.slice(0, cfg.line.length) === cfg.line) cls = "t-c";
      else if (c0 === '"' || c0 === "'" || c0 === "`") cls = "t-s";
      else if (c0 >= "0" && c0 <= "9") cls = "t-n";
      else if (kw[t] === true) cls = "t-k";
      out += cls ? '<span class="' + cls + '">' + esc(t) + "</span>" : esc(t);
      last = m.index + t.length;
    }
    return out + esc(s.slice(last));
  }

  // A fence language is plan text, so it is never echoed raw. Anything that is
  // not a plain language token is dropped rather than sanitised into something
  // half-recognisable.
  function fenceLang(raw) {
    var l = String(raw || "").trim().toLowerCase();
    return /^[a-z0-9][a-z0-9+#_.-]{0,19}$/.test(l) ? l : "";
  }

  function codeBlock(src, lang) {
    return '<div class="codeblock">' +
      (lang ? '<div class="lang">' + esc(lang) + "</div>" : "") +
      "<pre><code>" + highlight(src, lang) + "</code></pre></div>";
  }

  // -------------------------------------------------------------------------
  // Mermaid
  //
  // Rendered to inline SVG we generate ourselves. Vendoring mermaid.js would
  // mean ~3MB of third-party code inlined into a page whose entire claim is
  // that you can read it, so instead this covers the two diagram types plans
  // actually use and REFUSES the rest -- an unsupported diagram falls back to
  // its source rather than being drawn wrong and believed.
  //
  // Plan text reaches the SVG only as escaped element content. Every attribute
  // value here is a number this module computed or a fixed class name; the
  // fuzz suite audits that as a whitelist. Colour comes from CSS classes, so
  // there are no fill attributes and no url(#id) references at all.
  // -------------------------------------------------------------------------

  var CHW = 6.9;          // approximate advance width at the diagram font size
  var NODE_H = 36, DIAMOND_H = 48, PAD_X = 18, GAP_ALONG = 24, GAP_ACROSS = 54;

  function r1(v) { return Math.round(v * 10) / 10; }
  function textW(s) { return Math.round(String(s).length * CHW); }

  // Constructs we do not draw. Falling back is the point: a subgraph rendered
  // as loose nodes has silently lost the grouping, which is information.
  var MM_UNSUPPORTED =
    /^\s*(subgraph|end|classDef|class|click|style|linkStyle|loop|alt|else|opt|par|and|critical|break|rect|activate|deactivate|autonumber)\b/i;

  function svgOpen(w, h) {
    return '<svg class="mmd" viewBox="0 0 ' + r1(w) + " " + r1(h) + '" width="' +
      r1(w) + '" height="' + r1(h) + '" role="img">';
  }

  function svgText(x, y, label, cls) {
    return '<text class="' + cls + '" x="' + r1(x) + '" y="' + r1(y) +
      '" text-anchor="middle" dominant-baseline="central">' + esc(label) + "</text>";
  }

  // A label sitting on top of a line needs the line hidden behind it.
  function svgLabel(x, y, label) {
    var w = textW(label) + 10, h = 16;
    return '<rect class="mlabelbg" x="' + r1(x - w / 2) + '" y="' + r1(y - h / 2) +
      '" width="' + r1(w) + '" height="' + h + '" rx="3" ry="3"></rect>' +
      svgText(x, y, label, "mlabel");
  }

  function arrowHead(fx, fy, tx, ty) {
    var dx = tx - fx, dy = ty - fy;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var ux = dx / len, uy = dy / len, s = 7, w = 3.4;
    var bx = tx - ux * s, by = ty - uy * s;
    return '<polygon class="marrow" points="' +
      r1(tx) + "," + r1(ty) + " " +
      r1(bx - uy * w) + "," + r1(by + ux * w) + " " +
      r1(bx + uy * w) + "," + r1(by - ux * w) + '"></polygon>';
  }

  // Where a line from the node's centre towards (tx,ty) leaves its box.
  function boxEdge(n, tx, ty) {
    var dx = tx - n.cx, dy = ty - n.cy;
    if (!dx && !dy) return [n.cx, n.cy];
    var sx = dx ? (n.w / 2) / Math.abs(dx) : Infinity;
    var sy = dy ? (n.h / 2) / Math.abs(dy) : Infinity;
    var s = Math.min(sx, sy);
    return [n.cx + dx * s, n.cy + dy * s];
  }

  var MM_ID = "[A-Za-z0-9_.@-]+";
  var NODE_RE = new RegExp("^(" + MM_ID + ")\\s*(\\(\\([\\s\\S]*\\)\\)|\\(\\[[\\s\\S]*\\]\\)|" +
                           "\\[\\([\\s\\S]*\\)\\]|\\[[\\s\\S]*\\]|\\([\\s\\S]*\\)|" +
                           "\\{[\\s\\S]*\\})?$");
  var ARROW_RE = /^\s*([\s\S]*?)\s*(-\.->|-\.-|={2,3}>|={2,3}|-{2,3}>|-{2,3})\s*(?:\|\s*([^|]*?)\s*\|)?\s*([\s\S]*?)\s*;?\s*$/;
  var TAIL_ARROW_RE = /^\s*([\s\S]*?)\s*(-\.->|={1,3}>|-{1,3}>)\s*([\s\S]*?)\s*$/;

  function flowchart(lines, dir) {
    var nodes = Object.create(null), order = [], edges = [];

    function node(raw) {
      var m = NODE_RE.exec(String(raw).trim());
      if (!m) return null;
      var id = m[1], shaped = m[2] || "", label = id, shape = "rect";
      if (shaped) {
        if (shaped.slice(0, 2) === "((") { shape = "circle"; label = shaped.slice(2, -2); }
        else if (shaped.slice(0, 2) === "([") { shape = "stadium"; label = shaped.slice(2, -2); }
        else if (shaped.slice(0, 2) === "[(") { shape = "rect"; label = shaped.slice(2, -2); }
        else if (shaped.charAt(0) === "[") { shape = "rect"; label = shaped.slice(1, -1); }
        else if (shaped.charAt(0) === "(") { shape = "round"; label = shaped.slice(1, -1); }
        else { shape = "diamond"; label = shaped.slice(1, -1); }
        label = label.replace(/^\s*["']|["']\s*$/g, "").trim();
      }
      if (!nodes[id]) { nodes[id] = { id: id, label: label, shape: shape }; order.push(id); }
      else if (shaped) { nodes[id].label = label; nodes[id].shape = shape; }
      return nodes[id];
    }

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].replace(/;\s*$/, "");
      var m = ARROW_RE.exec(line);
      if (m) {
        var lhs = m[1], label = m[3] || "", rhs = m[4];
        // `A -- yes --> B`: the first arrow-shaped run is really the opening
        // half of a labelled edge, so re-split what looked like the target.
        if (m[2].indexOf(">") < 0) {
          var t = TAIL_ARROW_RE.exec(rhs);
          if (t) { label = label || t[1]; rhs = t[3]; }
        }
        var a = node(lhs), b = node(rhs);
        if (!a || !b) return { ok: false, note: "an edge that could not be parsed" };
        edges.push({ from: a.id, to: b.id, label: label, dashed: m[2].indexOf(".") >= 0 });
        continue;
      }
      if (!node(line)) return { ok: false, note: "a line that could not be parsed" };
    }

    if (!order.length) return { ok: false, note: "no nodes" };

    order.forEach(function (id) {
      var n = nodes[id];
      n.w = Math.max(58, textW(n.label) + PAD_X * 2 + (n.shape === "diamond" ? 22 : 0));
      n.h = n.shape === "diamond" ? DIAMOND_H : NODE_H;
    });

    // Break cycles before ranking. Simply bounding the iteration count is not
    // enough: a loop keeps pushing its own nodes down on every pass, so
    // `C --> A` in a four-node graph produced fifteen ranks of mostly empty
    // canvas. A back edge is found by DFS and excluded from the ranking; it is
    // still drawn, it just no longer decides where anything sits.
    var succ = Object.create(null);
    order.forEach(function (id) { succ[id] = []; });
    edges.forEach(function (e) { succ[e.from].push(e); });

    var state = Object.create(null);   // 1 = on the stack, 2 = done
    (function () {
      var stack = [];
      order.forEach(function (root) {
        if (state[root]) return;
        stack.push({ id: root, i: 0 });
        state[root] = 1;
        while (stack.length) {
          var top = stack[stack.length - 1];
          var list = succ[top.id];
          if (top.i >= list.length) { state[top.id] = 2; stack.pop(); continue; }
          var e = list[top.i++];
          if (state[e.to] === 1) { e.back = true; continue; }
          if (state[e.to] === 2) continue;
          state[e.to] = 1;
          stack.push({ id: e.to, i: 0 });
        }
      });
    })();

    var forward = edges.filter(function (e) { return !e.back; });
    var rank = Object.create(null);
    order.forEach(function (id) { rank[id] = 0; });
    for (var pass = 0; pass < order.length; pass++) {
      var moved = false;
      forward.forEach(function (e) {
        if (rank[e.to] < rank[e.from] + 1) { rank[e.to] = rank[e.from] + 1; moved = true; }
      });
      if (!moved) break;
    }

    var ranks = [];
    order.forEach(function (id) {
      var k = rank[id];
      (ranks[k] = ranks[k] || []).push(nodes[id]);
    });
    for (var k = 0; k < ranks.length; k++) ranks[k] = ranks[k] || [];

    var vertical = dir === "TD" || dir === "TB" || dir === "BT";
    var along = vertical ? "w" : "h", across = vertical ? "h" : "w";

    var spans = ranks.map(function (row) {
      var total = 0;
      row.forEach(function (n, j) { total += n[along] + (j ? GAP_ALONG : 0); });
      return total;
    });
    var maxAlong = Math.max.apply(null, spans.concat([0]));
    var acrossSizes = ranks.map(function (row) {
      return row.reduce(function (mx, n) { return Math.max(mx, n[across]); }, 0);
    });

    var M = 14, acrossPos = M, totalAcross = 0;
    ranks.forEach(function (row, ri) {
      var pos = M + (maxAlong - spans[ri]) / 2;
      row.forEach(function (n) {
        var a = pos + n[along] / 2;
        var b = acrossPos + acrossSizes[ri] / 2;
        n.cx = vertical ? a : b;
        n.cy = vertical ? b : a;
        pos += n[along] + GAP_ALONG;
      });
      acrossPos += acrossSizes[ri] + GAP_ACROSS;
      totalAcross = acrossPos - GAP_ACROSS + M;
    });

    var W = vertical ? maxAlong + M * 2 : totalAcross;
    var H = vertical ? totalAcross : maxAlong + M * 2;

    if (dir === "BT" || dir === "RL") {
      order.forEach(function (id) {
        var n = nodes[id];
        if (vertical) n.cy = H - n.cy; else n.cx = W - n.cx;
      });
    }

    var out = svgOpen(W, H) + '<g class="medges">';
    edges.forEach(function (e) {
      var a = nodes[e.from], b = nodes[e.to];
      var p1 = boxEdge(a, b.cx, b.cy), p2 = boxEdge(b, a.cx, a.cy);
      out += '<line class="medge' + (e.dashed ? " dash" : "") + '" x1="' + r1(p1[0]) +

          r1(n.cx) + "," + r1(y) + " " + r1(x + n.w) + "," + r1(n.cy) + " " +

  // A participant id must not contain "-": the id is matched greedily and an

    order.forEach(function (id) {

  // -------------------------------------------------------------------------
  // Revision diff
  //

  function norm(s) { return String(s).replace(/\s+/g, " ").trim(); }

  // Longest common subsequence over any two arrays, by a key function.

  // Word-level diff of two strings -> escaped HTML with <ins>/<del>.

    // that block now sits. Using the raw old index instead put a deleted
    // section wherever that number happened to land in the new plan, which
    // separated a removed heading from its own paragraph.
    removed.forEach(function (rem) {

<script>
(function () {

  var toggleEl = document.getElementById("viewtoggle");

    if (nAdded)   pills += '<span class="pill added">' + nAdded + " added</span>";

  blocks.forEach(function (b, idx) {

    wrap.dataset.index = String(idx);

    slot.className = "inline-slot";
    slot.id = "inline-" + idx;

  splitEl.className = "split";
  docEl.appendChild(splitEl);

  // Switch between the revision diff and the whole plan.
  //
  // "changes" hides untouched blocks behind a count, and renders edited blocks
  // as a word-level diff -- reading a whole plan again to find three altered
  // sentences is the thing this exists to avoid. "full" restores the plan as
  // written, because sometimes you need the shape of the whole thing.
  // Three views, because "what changed" and "does the whole thing still hang
  // together" are different questions:
  //   changes  -- only what moved, unchanged sections collapsed to a count
  //   fulldiff -- the whole plan, changes marked in place
  //   plan     -- the plan as written, no marks at all
  // A list, table, code block or diagram carries its meaning in its structure.
  // Word-diffing one collapses it into a single run-on line, which reads worse
  // than the plan does -- so these are marked as edited and rendered whole.
  function isStructural(html) {
    return /^<(ul|ol|table|pre|div|figure)/.test(html);
  }

  // Move every block back under the document, in order, undoing whatever the
  // split view did. The inline slot travels with its block: it is where a
  // comment lands whenever the rail is not showing.
  function restoreBlocks() {
    blocks.forEach(function (b, idx) {
      var el = blockEl(idx);
      var slot = document.getElementById("inline-" + idx);
      if (el) docEl.appendChild(el);
      if (slot) docEl.appendChild(slot);
    });
    docEl.appendChild(splitEl);
    splitEl.innerHTML = "";
  }

  function cell(cls) {
    var d = document.createElement("div");
    d.className = "scell " + cls;
    return d;
  }

  // Old text with no new counterpart, or the left half of an edit. There is no
  // stored html for a previous revision -- only its text -- so a structural
  // block is shown as preformatted text rather than re-rendered wrongly.
  // A div, not a p: the left column can hold a heading, list or table, and the
  // HTML parser breaks a block element out of a <p>, which silently reflowed
  // the column and knocked it out of alignment with its counterpart.
  function oldSide(html, structural) {
    var d = document.createElement("div");
    d.className = "old" + (structural ? " struct" : "");
    d.innerHTML = html;
    return d;
  }

  function buildSplit() {
    var head = document.createElement("div");
    head.className = "shead";
    head.innerHTML = "<span>Previous plan</span><span>This revision</span>";
    splitEl.appendChild(head);

    MD.splitRows(PREV, DATA.plan).forEach(function (row) {
      var tr = document.createElement("div");
      tr.className = "srow s-" + row.status;
      var left, right;

      if (row.status === "removed") {
        left = cell("sleft");
        left.appendChild(oldSide("<del>" + MD.esc(row.prevText) + "</del>", false));
        right = cell("sright sempty");
      } else {
        var b = blocks[row.index];
        var structural = isStructural(b.html);
        left = cell("sleft");
        if (row.status === "added") {
          left.className = "scell sleft sempty";
        } else if (row.status === "changed" && row.prevText && !structural) {
          left.appendChild(oldSide(MD.splitDiff(row.prevText, b.text).before, false));
        } else if (row.status === "changed") {
          left.appendChild(oldSide(MD.esc(row.prevText), true));
        } else {
          left.appendChild(oldSide(b.html, false));
        }
        right = cell("sright");
        var el = blockEl(row.index), slot = document.getElementById("inline-" + row.index);
        if (el) right.appendChild(el);
        if (slot) right.appendChild(slot);
      }

      tr.appendChild(left);
      tr.appendChild(right);
      splitEl.appendChild(tr);
    });
  }

  function applyView() {
    var marking = diff && view !== "plan";
    var split = !!diff && view === "split";

    document.querySelectorAll(".gap, .dropped").forEach(function (n) { n.remove(); });
    docEl.classList.toggle("marking", !!marking);
    document.body.classList.toggle("splitview", split);
    // Always pull the blocks back under the document first, split or not.
    // buildSplit() empties its container, and the blocks live inside it once
    // the split view is showing -- clearing before reclaiming them destroyed
    // every block element and took the comment being saved down with it.
    restoreBlocks();

    blocks.forEach(function (b, idx) {
      var el = blockEl(idx);
      if (!el) return;
      var st = status[idx] ? status[idx].status : "same";
      var bodyEl = el.querySelector(".body");

      if (!marking) {
        el.hidden = false;
        bodyEl.innerHTML = b.html;
        return;
      }

      // Word-diff prose only. A list or table's `text` is its items joined,
      // so diffing it would collapse the structure into a single run-on line --
      // less readable than the plan itself, which defeats the point.
      var structural = isStructural(b.html);
      if (st === "changed" && status[idx].prev && !structural) {
        // Side by side, the left column already carries the removals; showing
        // them again on the right is the thing split view exists to avoid.
        bodyEl.innerHTML = "<p>" + (split
          ? MD.splitDiff(status[idx].prev, b.text).after
          : MD.wordDiff(status[idx].prev, b.text)) + "</p>";
      } else {
        bodyEl.innerHTML = b.html;
      }

      // Keep a commented block visible even when unchanged: hiding a block
      // someone annotated would hide their own comment's anchor.
      var annotated = comments.some(function (c) { return c.blockIndex === idx; });
      el.hidden = (view === "changes" && st === "same" && !annotated);
    });

    if (split) {
      buildSplit();
      render();
      return;
    }

    if (marking) {
      // Collapse each run of hidden blocks into one honest marker. Only the
      // compact view hides anything, so only it needs these.
      var run = 0;
      if (view === "changes") {
        blocks.forEach(function (b, idx) {
          var el = blockEl(idx);
          if (!el) return;
          if (el.hidden) { run++; return; }
          if (run) { insertGap(el, run); run = 0; }
        });
        if (run) insertGap(null, run);
      }

      diff.removed.forEach(function (rem) {
        var node = document.createElement("div");
        node.className = "dropped";
        node.innerHTML = "<b>Removed:</b> " + MD.esc(MD.plain(rem.text).slice(0, 220));
        var anchor = blockEl(Math.min(rem.afterIndex, blocks.length - 1));
        if (anchor && anchor.parentNode) anchor.parentNode.insertBefore(node, anchor);
        else docEl.appendChild(node);
      });
    }

    render();
  }

  function insertGap(beforeEl, n) {
    var gap = document.createElement("div");
    gap.className = "gap";
    gap.textContent = n + (n === 1 ? " unchanged section" : " unchanged sections");
    gap.title = "Switch to Full plan to see these";
    if (beforeEl && beforeEl.parentNode) beforeEl.parentNode.insertBefore(gap, beforeEl);
    else docEl.appendChild(gap);
  }

  if (toggleEl) {
    toggleEl.addEventListener("click", function (e) {
      var btn = e.target.closest("button[data-view]");
      if (!btn) return;
      view = btn.dataset.view;
      toggleEl.querySelectorAll("button").forEach(function (b) {
        b.classList.toggle("on", b === btn);
      });
      applyView();
    });
  }

  // Ask the DOM whether the rail is actually visible rather than duplicating
  // the breakpoint here. A hardcoded matchMedia value silently desyncs the
  // moment the CSS changes, and the failure mode is comments rendered into a
  // display:none container -- invisible, with no error.
  function isWide() {
    return railEl.offsetParent !== null;
  }

  function blockEl(idx) {
    return docEl.querySelector('.blk[data-index="' + idx + '"]');
  }

  // Light up a block, its card and the hairline between them together. The
  // single hardest thing in a margin-comment layout is knowing which note
  // belongs to which paragraph; correlation on hover answers it without a click.
  function lite(idx, on) {
    var blk = blockEl(idx);
    if (blk) blk.classList.toggle("lit", on);
    document.querySelectorAll('.card[data-for-idx="' + idx + '"]').forEach(function (c) {
      c.classList.toggle("lit", on);
    });
    var path = leadersEl.querySelector('path[data-for-idx="' + idx + '"]');
    if (path) path.classList.toggle("lit", on);
  }

  function goTo(idx) {
    var blk = blockEl(idx);
    if (!blk) return;
    blk.scrollIntoView({ behavior: "smooth", block: "center" });
    lite(idx, true);
    setTimeout(function () { lite(idx, false); }, 1400);
  }

  function containerFor(idx) {
    return isWide() ? railEl : document.getElementById("inline-" + idx);
  }

  // editing: pass the existing comment to edit it in place; omit to add a new
  // one to block `idx`.
  function openComposer(idx, editing) {
    var existing = document.getElementById("composer");
    if (existing) existing.remove();

    var box = document.createElement("div");
    box.className = "card composer";
    box.id = "composer";
    box.dataset.forIdx = String(idx);
    if (editing) box.dataset.editing = String(editing.id);

    var ta = document.createElement("textarea");
    ta.placeholder = "What should change here?";
    ta.setAttribute("aria-label", "Comment");
    if (editing) ta.value = editing.body;

    var row = document.createElement("div");
    row.className = "row";

    var save = document.createElement("button");
    save.className = "btn small warn";
    save.type = "button";
    save.textContent = editing ? "Save" : "Add comment";

    var cancel = document.createElement("button");
    cancel.className = "linkbtn";
    cancel.type = "button";
    cancel.textContent = "Cancel";

    var kbd = document.createElement("span");
    kbd.className = "kbd";
    kbd.textContent = "⌘↩";

    row.appendChild(save); row.appendChild(cancel); row.appendChild(kbd);
    box.appendChild(ta); box.appendChild(row);

    box.dataset.forIdx = String(idx);
    containerFor(idx).appendChild(box);
    render();
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);

    function commit() {
      var body = ta.value.trim();
      if (!body) { box.remove(); render(); return; }
      if (editing) {
        editing.body = body;
      } else {
        var b = blocks[idx];
        comments.push({
          id: nextId++,
          blockIndex: idx,
          section: b.section || "",
          anchor: truncate(MD.plain(b.text)),
          body: body
        });
      }
      box.remove();
      // applyView, not render: commenting on an unchanged block has to un-hide
      // it in the Changes view, or the comment's anchor vanishes and its leader
      // line points off the top of the page.
      applyView();
    }
    save.addEventListener("click", commit);
    cancel.addEventListener("click", function () { box.remove(); render(); });
    ta.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); commit(); }
      if (e.key === "Escape") { e.preventDefault(); box.remove(); render(); }
    });
  }

  function render() {
    // Re-parent any open composer before rebuilding. Crossing the breakpoint
    // with a composer open used to strand it inside a display:none container,
    // silently hiding a half-typed comment.
    var openBox = document.getElementById("composer");
    if (openBox) {
      var target = containerFor(+openBox.dataset.forIdx);
      if (target && openBox.parentNode !== target) {
        var active = document.activeElement === openBox.querySelector("textarea");
        target.appendChild(openBox);
        if (active) openBox.querySelector("textarea").focus();
      }
    }

    document.querySelectorAll(".blk").forEach(function (el) {
      el.classList.remove("has-note");
      var m = el.querySelector(".marker");
      if (m) m.remove();
    });
    document.querySelectorAll(".inline-slot").forEach(function (s) {
      if (!s.querySelector(".composer")) s.innerHTML = "";
    });
    railEl.querySelectorAll(".card:not(.composer)").forEach(function (c) { c.remove(); });

    var wide = isWide();

    var editingId = openBox && openBox.dataset.editing
      ? Number(openBox.dataset.editing) : null;

    comments.forEach(function (c, i) {
      var el = blockEl(c.blockIndex);
      if (el) {
        el.classList.add("has-note");
        if (!el.querySelector(".marker")) {
          var mk = document.createElement("span");
          mk.className = "marker";
          mk.textContent = String(i + 1);
          mk.setAttribute("aria-label", "Comment " + (i + 1));
          mk.addEventListener("click", function () { goTo(c.blockIndex); });
          el.appendChild(mk);
        }
      }

      if (c.id === editingId) return;   // it is open in the composer instead

      var card = document.createElement("div");
      card.className = "card";
      card.dataset.forIdx = String(c.blockIndex);
      card.setAttribute("data-for-idx", String(c.blockIndex));
      card.addEventListener("mouseenter", function () { lite(c.blockIndex, true); });
      card.addEventListener("mouseleave", function () { lite(c.blockIndex, false); });

      var q = document.createElement("div");
      q.className = "quote";
      // When the commented block is the heading itself, section and anchor are
      // the same string -- show it once.
      var label = (c.section && c.anchor.replace(/…$/, "").trim() !== c.section)
        ? c.section + " — " + c.anchor
        : (c.section || c.anchor);
      q.innerHTML = '<span class="num">' + (i + 1) + '</span><span class="qtext">' +
        MD.esc(label) + "</span>";
      q.title = "Jump to this part of the plan";
      q.addEventListener("click", function () { goTo(c.blockIndex); });

      var t = document.createElement("div");
      t.className = "text";
      t.textContent = c.body;

      var acts = document.createElement("div");
      acts.className = "acts";

      var edit = document.createElement("button");
      edit.className = "linkbtn";
      edit.type = "button";
      edit.textContent = "Edit";
      edit.addEventListener("click", function () {
        openComposer(c.blockIndex, c);
      });

      var del = document.createElement("button");
      del.className = "linkbtn";
      del.type = "button";
      del.textContent = "Delete";
      del.addEventListener("click", function () {
        comments = comments.filter(function (x) { return x.id !== c.id; });
        applyView();   // may re-hide a block that was only shown for this comment
      });

      acts.appendChild(edit);
      acts.appendChild(del);

      card.appendChild(q); card.appendChild(t); card.appendChild(acts);
      // Never let a missing container throw: an exception here aborts the rest
      // of render() mid-rebuild, and the comment the reviewer just typed is
      // still in `comments` but nowhere on screen -- it looks lost.
      var into = wide ? railEl : document.getElementById("inline-" + c.blockIndex);
      (into || docEl).appendChild(card);
    });

    if (wide) { positionRail(); } else if (leadersEl) { leadersEl.innerHTML = ""; }

    var n = comments.length;
    countEl.textContent = n === 0 ? "no comments" : n + (n === 1 ? " comment" : " comments");
    countEl.dataset.has = n ? "1" : "0";
    countEl.disabled = n === 0;
    document.getElementById("hint").hidden = n > 0;
    updateActions();
  }

  // Align every rail card with the block it annotates.
  //
  // The previous version set a single padding-top on the rail from the first
  // comment's block and let the rest stack beneath it, so every card after the
  // first drifted away from its block. Each card is now positioned against its
  // own block, walking top-down and pushing a card down only far enough to
  // clear the one above it.
  var CARD_GAP = 10;

  function positionRail() {
    var items = railEl.querySelectorAll(".card");
    if (!items.length) { railEl.style.height = "0px"; return; }

    var railTop = railEl.getBoundingClientRect().top;

    // Order by the position of the block each card annotates, NOT by DOM
    // order. An open composer is appended last but may belong to a block near
    // the top; walking DOM order would pin it first and shove every earlier
    // card down past its own block.
    var entries = Array.prototype.map.call(items, function (el) {
      var idx = el.dataset.forIdx;
      var blk = idx === undefined ? null : blockEl(+idx);
      return {
        el: el,
        desired: blk ? blk.getBoundingClientRect().top - railTop : 0,
        order: idx === undefined ? 0 : +idx
      };
    });
    entries.sort(function (a, b) { return a.order - b.order; });

    var cursor = 0;
    entries.forEach(function (e) {
      var top = Math.max(e.desired, cursor);
      e.el.style.position = "absolute";
      e.el.style.top = top + "px";
      e.el.style.left = "0";
      e.el.style.right = "0";
      cursor = top + e.el.offsetHeight + CARD_GAP;
      // Keep DOM order matching visual order so tabbing follows the page.
      railEl.appendChild(e.el);
    });

    // Cards are absolutely positioned, so the rail needs an explicit height or
    // its grid track collapses and the page scrolls short.
    railEl.style.height = cursor + "px";
    railEl.style.paddingTop = "0px";
    drawLeaders(entries);
  }

  // A curve from each annotated block to its card. Without it the reader has to
  // guess which note goes with which paragraph whenever two sit close together.
  function drawLeaders(entries) {
    var wrapEl = document.querySelector(".wrap");
    if (!wrapEl || !leadersEl) return;
    var wr = wrapEl.getBoundingClientRect();
    var dr = docEl.getBoundingClientRect();
    var rr = railEl.getBoundingClientRect();
    leadersEl.setAttribute("viewBox", "0 0 " + wr.width + " " + wr.height);
    leadersEl.setAttribute("width", wr.width);
    leadersEl.setAttribute("height", wr.height);

    var d = "";
    entries.forEach(function (e) {
      if (e.el.id === "composer") return;
      var blk = blockEl(e.order);
      if (!blk) return;
      var br = blk.getBoundingClientRect();
      var x1 = dr.right - wr.left + 6;
      var y1 = br.top - wr.top + 14;
      var x2 = rr.left - wr.left - 6;
      var y2 = parseFloat(e.el.style.top || 0) + (rr.top - wr.top) + 15;
      var mid = x1 + (x2 - x1) / 2;
      d += '<path data-for-idx="' + e.order + '" d="M' + x1 + ',' + y1 +
           ' C' + mid + ',' + y1 + ' ' + mid + ',' + y2 + ' ' + x2 + ',' + y2 + '"/>';
    });
    leadersEl.innerHTML = d;
  }

  function updateActions() {
    var nComments = comments.length;
    var hasNotes = notesEl.value.trim().length > 0;
    var hasFeedback = nComments > 0 || hasNotes;

    rejectBtn.disabled = !hasFeedback;
    rejectBtn.title = hasFeedback ? "" : "Add a comment or a note first";

    var parts = [];
    if (nComments) parts.push(nComments + (nComments === 1 ? " comment" : " comments"));
    if (hasNotes) parts.push("a note");

    // Emphasis follows what you have actually done: with feedback written, the
    // action that carries it is the primary one. A solid Approve shouting at
    // you while five unsent comments sit in the margin is the wrong signal.
    if (!hasFeedback) {
      noticeEl.hidden = true;
      summaryEl.textContent = "Nothing to send yet";
      summaryEl.classList.remove("armed");
      approveBtn.textContent = "Approve";
      approveBtn.classList.add("primary");
      approveBtn.classList.remove("quiet");
      rejectBtn.classList.remove("warn");
      return;
    }

    summaryEl.textContent = parts.join(" + ") + " ready to send";
    summaryEl.classList.add("armed");
    rejectBtn.classList.add("warn");
    approveBtn.classList.remove("primary");
    approveBtn.classList.add("quiet");

    // An allow decision has no message channel back to Claude, so approving
    // discards BOTH comments and notes. The old copy warned about notes only,
    // which meant you could write five comments, approve, and lose every one
    // of them with no warning at all.
    noticeTextEl.innerHTML = "Approving sends the plan through unchanged and " +
      "<b>discards " + parts.join(" and ") + "</b> — an approval carries no " +
      "message back to Claude. Use <b>Request changes</b> to send them.";
    noticeEl.hidden = false;
    approveBtn.textContent = "Approve anyway";
  }

  // Clicking the count walks through your comments in document order -- in a
  // long plan there is otherwise no way to find them again.
  var cycle = 0;
  countEl.addEventListener("click", function () {
    if (!comments.length) return;
    cycle = cycle % comments.length;
    goTo(comments[cycle].blockIndex);
    cycle++;
  });

  // The notes field grows with its content instead of being a one-line slot
  // pretending to hold a paragraph.
  function autoGrow() {
    notesEl.style.height = "auto";
    notesEl.style.height = Math.min(notesEl.scrollHeight, 168) + "px";
  }
  notesEl.addEventListener("input", function () { autoGrow(); updateActions(); });
  autoGrow();

  // ---------------- submit ----------------
  function send(verdict) {
    if (submitted) return;
    submitted = true;
    approveBtn.disabled = true;
    rejectBtn.disabled = true;

    var payload = {
      verdict: verdict,
      comments: comments.map(function (c) {
        return { section: c.section, anchor: c.anchor, body: c.body };
      }),
      notes: notesEl.value.trim()
    };

    fetch("/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Plantor-Token": TOKEN },
      body: JSON.stringify(payload)
    }).then(function (r) {
      if (r.status === 410) {
        // Someone or something already decided this review. Say so plainly --
        // a generic "try again" would have the reviewer retrying forever.
        return r.json().catch(function () { return {}; }).then(function (d) {
          throw new Error("ALREADY:" + (d.verdict || "unknown") + ":" + (d.at || ""));
        });
      }
      if (!r.ok) throw new Error("submit failed: " + r.status);
      finish(verdict);
    }).catch(function (err) {
      // Never claim delivery we did not get. Treating a failure as success
      // would have the user close the tab believing they were done while the
      // hook sits waiting for a submission that never arrived.
      submitted = false;
      approveBtn.disabled = false;
      updateActions();
      showError(String(err && err.message ? err.message : err));
    });
  }

  function showError(detail) {
    var bar = document.querySelector(".bar");
    var existing = document.getElementById("submit-error");
    if (existing) existing.remove();
    var p = document.createElement("p");
    p.id = "submit-error";
    p.className = "notice error";
    p.setAttribute("role", "alert");
    if (detail.indexOf("ALREADY:") === 0) {
      var bits = detail.split(":");
      p.textContent = "This review was already decided (" + bits[1] +
        (bits[2] ? " at " + bits[2] : "") + "), so your submission was not " +
        "recorded. Claude has already been told. If that wasn't you, the " +
        "review URL was not private.";
      p.classList.add("hard");
    } else {
      p.textContent = "Could not send to plantor (" + detail + "). Nothing was " +
        "submitted — try again.";
    }
    bar.parentNode.insertBefore(p, bar);
  }

  function finish(verdict) {
    var approved = verdict === "approve";
    document.getElementById("app").innerHTML =
      '<div class="done">' +
      '<div class="mark ' + (approved ? "ok" : "back") + '">' +
        (approved ? "✓" : "↺") + "</div>" +
      "<h2>" + (approved ? "Plan approved" : "Changes requested") + "</h2>" +
      "<p>" + (approved
        ? "Sent back to Claude. You can close this tab."
        : comments.length + (comments.length === 1 ? " comment" : " comments") +
          " sent back to Claude. You can close this tab.") +
      "</p></div>";
  }

  var approveArmed = false;
  approveBtn.addEventListener("click", function () {
    var hasFeedback = comments.length > 0 || notesEl.value.trim().length > 0;
    if (hasFeedback && !approveArmed) {
      // One deliberate second press. Submitting is irreversible and this one
      // throws away work you just did.
      approveArmed = true;
      approveBtn.textContent = "Discard and approve?";
      approveBtn.classList.add("warn");
      approveBtn.classList.remove("primary");
      setTimeout(function () {
        if (!approveArmed) return;
        approveArmed = false;
        approveBtn.classList.remove("warn");
        updateActions();
      }, 4000);
      return;
    }
    send("approve");
  });
  rejectBtn.addEventListener("click", function () { if (!rejectBtn.disabled) send("reject"); });

  // A modifier shortcut is safe where a bare key was not: it cannot fire from
  // ordinary typing, and it only ever triggers the non-destructive verdict.
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" || !(e.metaKey || e.ctrlKey)) return;
    if (document.getElementById("composer")) return;   // the composer owns it
    if (rejectBtn.disabled) return;
    e.preventDefault();
    send("reject");
  });

  // Deliberately NO single-key shortcuts for approve/reject. Submitting is
  // irreversible -- it goes straight back to Claude with no undo -- and a bare
  // "a" or "r" fires the moment focus is anywhere but a text field, which is
  // one stray keystroke away from approving a plan you meant to annotate.

  window.addEventListener("resize", function () { render(); });
  // Fonts landing after first paint shift block offsets underneath us.
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { if (isWide()) positionRail(); });
  }

  applyView();
})();
</script>
</body>
</html>
