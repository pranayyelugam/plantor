<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'">
<title>Plan review</title>
<style>
:root {
  --bg: #0f1012;
  --surface: #17181c;
  --surface-2: #1d1f24;
  --ink: #e8e6e3;
  --ink-dim: #9a978f;
  --ink-faint: #6b6862;
  --line: #26282e;
  --line-strong: #34373f;
  --accent: #d9a441;
  --accent-dim: rgba(217, 164, 65, 0.16);
  --ok: #7fb069;
  --ok-dim: rgba(127, 176, 105, 0.14);
  --warn: #d9a441;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
  --radius: 10px;
  --f-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --f-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #faf9f7;
    --surface: #ffffff;
    --surface-2: #f4f2ee;
    --ink: #1a1a1a;
    --ink-dim: #5f5b54;
    --ink-faint: #8c877e;
    --line: #e5e1d9;
    --line-strong: #d3cec4;
    --accent: #a06f10;
    --accent-dim: rgba(160, 111, 16, 0.10);
    --ok: #3f7d33;
    --ok-dim: rgba(63, 125, 51, 0.10);
    --warn: #a06f10;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06);
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-sans);
  font-size: 17px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

/* ---------- header ---------- */
.top {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 14px;
  padding: 12px 24px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.6) blur(12px);
  border-bottom: 1px solid var(--line);
}
.top h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
.cwd {
  font-family: var(--f-mono); font-size: 12px; color: var(--ink-faint);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0;
}
.count {
  font-size: 12px; color: var(--ink-dim); font-variant-numeric: tabular-nums;
  padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px;
  white-space: nowrap;
}
.count[data-has="1"] { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }

/* ---------- layout ---------- */
.wrap {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0;
  padding: 32px 24px 140px;
  max-width: 1500px; margin: 0 auto;
}
.doc { min-width: 0; max-width: 72ch; }
.rail { display: none; position: relative; }

/* Base rules MUST precede this override: same specificity, so source order
   decides. With them after, the rail stayed hidden at every width and rail
   comments rendered into a display:none container. */
@media (min-width: 1100px) {
  .wrap { grid-template-columns: minmax(0, 72ch) 340px; gap: 40px; justify-content: center; }
  .rail { display: block; }
}

.hint {
  font-size: 13px; color: var(--ink-faint); margin: 0 0 24px;
  transition: opacity .3s ease-out;
}
.hint[hidden] { display: none; }

/* ---------- plan blocks ---------- */
.blk { position: relative; padding-left: 30px; margin: 0 0 2px; }
.blk > .body > *:first-child { margin-top: 0; }
.blk > .body > *:last-child { margin-bottom: 0; }
.blk .body {
  padding: 3px 10px 3px 8px;
  border-left: 2px solid transparent;
  border-radius: 0 6px 6px 0;
  transition: background .15s ease-out, border-color .15s ease-out;
}
.blk:hover .body { background: var(--surface); }
.blk.has-note .body { border-left-color: var(--accent); background: var(--accent-dim); }

.add {
  position: absolute; left: 0; top: 5px;
  width: 22px; height: 22px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--line-strong); border-radius: 6px;
  background: var(--surface); color: var(--ink-dim);
  font-family: var(--f-sans); font-size: 15px; line-height: 1;
  cursor: pointer; opacity: 0;
  transition: opacity .15s ease-out, color .15s ease-out, border-color .15s ease-out;
}
.blk:hover .add, .add:focus-visible { opacity: 1; }
.add:hover { color: var(--accent); border-color: var(--accent); }
.marker {
  position: absolute; left: 0; top: 5px;
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 6px; background: var(--accent); color: var(--bg);
  font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.blk.has-note .add { display: none; }

/* ---------- markdown ---------- */
.doc h1, .doc h2, .doc h3 { line-height: 1.25; letter-spacing: -0.015em; font-weight: 640; }
.doc h1 { font-size: 28px; margin: 0 0 4px; }
.doc h2 { font-size: 21px; margin: 30px 0 4px; }
.doc h3 { font-size: 17px; margin: 22px 0 2px; }
.doc p { margin: 0 0 14px; }
.doc ul, .doc ol { margin: 0 0 14px; padding-left: 24px; }
.doc li { margin: 3px 0; }
.doc blockquote {
  margin: 0 0 14px; padding: 2px 0 2px 14px;
  border-left: 2px solid var(--line-strong); color: var(--ink-dim);
}
.doc hr { border: 0; border-top: 1px solid var(--line); margin: 26px 0; }
.doc code {
  font-family: var(--f-mono); font-size: .86em;
  background: var(--surface-2); border: 1px solid var(--line);
  padding: .1em .26em; border-radius: 4px;
}
.doc pre {
  font-family: var(--f-mono); font-size: 13px; line-height: 1.55;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 8px; padding: 12px 14px; margin: 0 0 14px;
  overflow-x: auto;
}
.doc pre code { background: none; border: 0; padding: 0; font-size: inherit; }
.doc table {
  border-collapse: collapse; width: 100%; margin: 0 0 14px; font-size: 14px;
  display: block; overflow-x: auto;
}
.doc th, .doc td {
  border: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top;
}
.doc th { background: var(--surface-2); font-weight: 600; }
.doc strong { font-weight: 650; }

/* ---------- comments ---------- */
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 12px; margin-bottom: 10px;
  box-shadow: var(--shadow);
}
.card .num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; border-radius: 5px;
  background: var(--accent); color: var(--bg);
  font-size: 10px; font-weight: 700; margin-right: 7px;
}
.card .quote {
  font-size: 12px; color: var(--ink-faint); margin-bottom: 8px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card .text { font-size: 14px; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word; }
.card .acts { margin-top: 8px; display: flex; gap: 8px; }
.linkbtn {
  background: none; border: 0; padding: 0; cursor: pointer;
  font-family: var(--f-sans); font-size: 12px; color: var(--ink-faint);
}
.linkbtn:hover { color: var(--accent); }

textarea {
  width: 100%; resize: vertical; min-height: 76px;
  font-family: var(--f-sans); font-size: 14px; line-height: 1.55;
  color: var(--ink); background: var(--bg);
  border: 1px solid var(--line-strong); border-radius: 8px; padding: 9px 11px;
}
textarea::placeholder { color: var(--ink-faint); }
.composer .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.kbd {
  font-family: var(--f-mono); font-size: 11px; color: var(--ink-faint); margin-left: auto;
}

/* ---------- inline comments below 1100px ---------- */
.inline-slot { margin: 8px 0 14px 30px; }
@media (min-width: 1100px) { .inline-slot { display: none; } }

/* ---------- buttons ---------- */
button { font-family: var(--f-sans); }
.btn {
  font-size: 13px; font-weight: 550; padding: 8px 14px;
  border-radius: 8px; border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--ink); cursor: pointer;
  transition: background .15s ease-out, border-color .15s ease-out, opacity .15s ease-out;
}
.btn:hover:not(:disabled) { border-color: var(--ink-faint); }
.btn.primary { background: var(--ok-dim); border-color: var(--ok); color: var(--ok); }
.btn.primary:hover:not(:disabled) { background: var(--ok); color: var(--bg); }
.btn.warn { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
.btn.warn:hover:not(:disabled) { background: var(--accent); color: var(--bg); }
.btn:disabled { opacity: .38; cursor: not-allowed; }
.btn.small { font-size: 12px; padding: 5px 10px; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------- footer ---------- */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 24px;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: saturate(1.6) blur(12px);
  border-top: 1px solid var(--line);
}
.bar .notes { flex: 1; min-width: 0; max-width: 620px; }
.bar textarea { min-height: 40px; height: 40px; font-size: 13px; padding: 9px 11px; }
.bar .btns { display: flex; gap: 8px; align-items: center; padding-top: 1px; }
.notice {
  font-size: 12px; color: var(--warn); margin: 6px 0 0;
}
.notice[hidden] { display: none; }

/* ---------- done ---------- */
.done { max-width: 460px; margin: 18vh auto; text-align: center; padding: 0 24px; }
.done .mark {
  width: 40px; height: 40px; margin: 0 auto 18px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--ok-dim); color: var(--ok); font-size: 19px;
}
.done h2 { font-size: 19px; margin: 0 0 8px; font-weight: 620; }
.done p { color: var(--ink-dim); font-size: 14px; margin: 0; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<!--PLANTOR_DATA-->

<div id="app">
  <header class="top">
    <h1>Plan review</h1>
    <span class="cwd" id="cwd"></span>
    <span class="count" id="count" aria-live="polite" data-has="0">no comments</span>
  </header>

  <div class="wrap">
    <main class="doc" id="doc" aria-label="Plan"></main>
    <aside class="rail" id="rail" aria-label="Comments"></aside>
  </div>

  <footer class="bar">
    <div class="notes">
      <textarea id="notes" placeholder="Overall notes (optional)" aria-label="Overall notes"></textarea>
      <p class="notice" id="notice" hidden>Notes are only sent with <strong>Request changes</strong> — approving discards them.</p>
    </div>
    <div class="btns">
      <button class="btn warn" id="reject" disabled title="Add a comment or a note first">Request changes</button>
      <button class="btn primary" id="approve">Approve</button>
    </div>
  </footer>
</div>

<script>
(function () {
  "use strict";

  // ---- bootstrap: read injected data, then scrub the token from the URL ----
  var DATA = JSON.parse(document.getElementById("plantor-data").textContent);
  var TOKEN = new URLSearchParams(location.search).get("t") || "";
  try {
    history.replaceState(null, "", location.pathname);
  } catch (e) { /* non-fatal */ }

  var comments = [];   // {id, blockIndex, quote, body}
  var nextId = 1;
  var submitted = false;

  // ---------------- markdown ----------------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // Strip markdown emphasis for on-screen quoting. Never applied to the text
  // sent back to Claude, which stays verbatim.
  function plainQuote(s) {
    return String(s)
      .replace(/`([^`]+)`/g, "$1")
      .replace(/\*\*([^*]+)\*\*/g, "$1")
      .replace(/(^|[^*])\*([^*]+)\*/g, "$1$2")
      .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
      .replace(/^#{1,6}\s+/, "")
      .trim();
  }

  // Inline formatting. Code spans are extracted first so their contents are
  // never treated as markup.
  function inline(text) {
    var spans = [];
    var out = String(text).replace(/`([^`]+)`/g, function (_, code) {
      spans.push("<code>" + esc(code) + "</code>");
      return "\u0001" + (spans.length - 1) + "\u0001";
    });
    out = esc(out);
    out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    out = out.replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>");
    // Links render as inert text: the label, with the target in parentheses.
    // Nothing on this page is clickable to an external origin.
    out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, "$1 ($2)");
    return out.replace(/\u0001(\d+)\u0001/g, function (_, i) { return spans[+i]; });
  }

  // Block parser -> [{html, text}]. Each entry becomes one annotatable block.
  function parse(md) {
    var lines = String(md).replace(/\r\n?/g, "\n").split("\n");
    var blocks = [];
    var i = 0;

    function flushPara(buf) {
      if (!buf.length) return;
      var text = buf.join(" ");
      blocks.push({ html: "<p>" + inline(text) + "</p>", text: text });
    }

    var para = [];
    while (i < lines.length) {
      var line = lines[i];

      if (/^```/.test(line)) {
        flushPara(para); para = [];
        var code = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])) { code.push(lines[i]); i++; }
        i++;
        blocks.push({
          html: "<pre><code>" + esc(code.join("\n")) + "</code></pre>",
          text: code.join("\n")
        });
        continue;
      }

      if (/^\s*$/.test(line)) { flushPara(para); para = []; i++; continue; }

      var h = /^(#{1,6})\s+(.*)$/.exec(line);
      if (h) {
        flushPara(para); para = [];
        var lvl = Math.min(h[1].length, 3);
        blocks.push({ html: "<h" + lvl + ">" + inline(h[2]) + "</h" + lvl + ">", text: h[2] });
        i++; continue;
      }

      if (/^\s*(---+|\*\*\*+|___+)\s*$/.test(line)) {
        flushPara(para); para = [];
        blocks.push({ html: "<hr>", text: "---" });
        i++; continue;
      }

      // table: a header row followed by a |---|---| separator
      if (/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
        flushPara(para); para = [];
        var rows = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(lines[i]); i++; }
        var cells = function (r) {
          return r.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(function (c) { return c.trim(); });
        };
        var head = cells(rows[0]);
        var html = "<table><thead><tr>";
        head.forEach(function (c) { html += "<th>" + inline(c) + "</th>"; });
        html += "</tr></thead><tbody>";
        rows.slice(2).forEach(function (r) {
          html += "<tr>";
          cells(r).forEach(function (c) { html += "<td>" + inline(c) + "</td>"; });
          html += "</tr>";
        });
        html += "</tbody></table>";
        blocks.push({ html: html, text: rows.join(" ") });
        continue;
      }

      if (/^\s*>/.test(line)) {
        flushPara(para); para = [];
        var q = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) {
          q.push(lines[i].replace(/^\s*>\s?/, "")); i++;
        }
        blocks.push({
          html: "<blockquote>" + inline(q.join(" ")) + "</blockquote>",
          text: q.join(" ")
        });
        continue;
      }

      if (/^\s*([-*+]|\d+\.)\s+/.test(line)) {
        flushPara(para); para = [];
        var ordered = /^\s*\d+\./.test(line);
        var items = [];
        while (i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])) {
          items.push(lines[i].replace(/^\s*([-*+]|\d+\.)\s+/, ""));
          i++;
          // continuation lines indented under the item
          while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*+]|\d+\.)\s+/.test(lines[i])) {
            items[items.length - 1] += " " + lines[i].trim(); i++;
          }
        }
        var tag = ordered ? "ol" : "ul";
        var lhtml = "<" + tag + ">";
        items.forEach(function (it) { lhtml += "<li>" + inline(it) + "</li>"; });
        lhtml += "</" + tag + ">";
        blocks.push({ html: lhtml, text: items.join(" ") });
        continue;
      }

      para.push(line.trim());
      i++;
    }
    flushPara(para);
    return blocks;
  }

  // ---------------- render ----------------
  var docEl = document.getElementById("doc");
  var railEl = document.getElementById("rail");
  var countEl = document.getElementById("count");
  var noticeEl = document.getElementById("notice");
  var notesEl = document.getElementById("notes");
  var rejectBtn = document.getElementById("reject");
  var approveBtn = document.getElementById("approve");

  document.getElementById("cwd").textContent = DATA.cwd || "";

  var blocks = parse(DATA.plan);

  var hint = document.createElement("p");
  hint.className = "hint";
  hint.id = "hint";
  hint.textContent = "Hover any block and press + to comment on it.";
  docEl.appendChild(hint);

  blocks.forEach(function (b, idx) {
    var wrap = document.createElement("div");
    wrap.className = "blk";
    wrap.dataset.index = String(idx);

    var add = document.createElement("button");
    add.className = "add";
    add.type = "button";
    add.textContent = "+";
    add.setAttribute("aria-label", "Comment on this section");
    add.addEventListener("click", function () { openComposer(idx); });

    var body = document.createElement("div");
    body.className = "body";
    body.innerHTML = b.html;   // built only from escaped text above

    wrap.appendChild(add);
    wrap.appendChild(body);
    docEl.appendChild(wrap);

    var slot = document.createElement("div");
    slot.className = "inline-slot";
    slot.id = "inline-" + idx;
    docEl.appendChild(slot);
  });

  function blockEl(idx) {
    return docEl.querySelector('.blk[data-index="' + idx + '"]');
  }

  function openComposer(idx) {
    var existing = document.getElementById("composer");
    if (existing) existing.remove();

    var box = document.createElement("div");
    box.className = "card composer";
    box.id = "composer";

    var ta = document.createElement("textarea");
    ta.placeholder = "What should change here?";
    ta.setAttribute("aria-label", "Comment");

    var row = document.createElement("div");
    row.className = "row";

    var save = document.createElement("button");
    save.className = "btn small warn";
    save.type = "button";
    save.textContent = "Add comment";

    var cancel = document.createElement("button");
    cancel.className = "linkbtn";
    cancel.type = "button";
    cancel.textContent = "Cancel";

    var kbd = document.createElement("span");
    kbd.className = "kbd";
    kbd.textContent = "⌘↩";

    row.appendChild(save); row.appendChild(cancel); row.appendChild(kbd);
    box.appendChild(ta); box.appendChild(row);

    document.getElementById("inline-" + idx).appendChild(box);
    if (window.matchMedia("(min-width: 1100px)").matches) {
      railEl.appendChild(box);
      positionRail();
    }
    ta.focus();

    function commit() {
      var body = ta.value.trim();
      if (!body) { box.remove(); return; }
      comments.push({ id: nextId++, blockIndex: idx, quote: blocks[idx].text, body: body });
      box.remove();
      render();
    }
    save.addEventListener("click", commit);
    cancel.addEventListener("click", function () { box.remove(); });
    ta.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); commit(); }
      if (e.key === "Escape") { e.preventDefault(); box.remove(); }
    });
  }

  function render() {
    document.querySelectorAll(".blk").forEach(function (el) {
      el.classList.remove("has-note");
      var m = el.querySelector(".marker");
      if (m) m.remove();
    });
    document.querySelectorAll(".inline-slot").forEach(function (s) {
      if (!s.querySelector(".composer")) s.innerHTML = "";
    });
    railEl.querySelectorAll(".card:not(.composer)").forEach(function (c) { c.remove(); });

    var wide = window.matchMedia("(min-width: 1100px)").matches;

    comments.forEach(function (c, i) {
      var el = blockEl(c.blockIndex);
      if (el) {
        el.classList.add("has-note");
        if (!el.querySelector(".marker")) {
          var mk = document.createElement("span");
          mk.className = "marker";
          mk.textContent = String(i + 1);
          mk.setAttribute("aria-label", "Comment " + (i + 1));
          el.appendChild(mk);
        }
      }

      var card = document.createElement("div");
      card.className = "card";

      var q = document.createElement("div");
      q.className = "quote";
      // Display only: the quote sent to Claude keeps its original markdown,
      // but showing raw ** and ` here just looks like noise.
      q.innerHTML = '<span class="num">' + (i + 1) + "</span>" +
        esc(plainQuote(c.quote).slice(0, 160));

      var t = document.createElement("div");
      t.className = "text";
      t.textContent = c.body;

      var acts = document.createElement("div");
      acts.className = "acts";
      var del = document.createElement("button");
      del.className = "linkbtn";
      del.type = "button";
      del.textContent = "Delete";
      del.addEventListener("click", function () {
        comments = comments.filter(function (x) { return x.id !== c.id; });
        render();
      });
      acts.appendChild(del);

      card.appendChild(q); card.appendChild(t); card.appendChild(acts);
      (wide ? railEl : document.getElementById("inline-" + c.blockIndex)).appendChild(card);
    });

    if (wide) positionRail();

    var n = comments.length;
    countEl.textContent = n === 0 ? "no comments" : n + (n === 1 ? " comment" : " comments");
    countEl.dataset.has = n ? "1" : "0";
    document.getElementById("hint").hidden = n > 0;
    updateActions();
  }

  // Align the first rail card with the block it annotates.
  function positionRail() {
    var first = railEl.querySelector(".card");
    if (!first || !comments.length) { railEl.style.paddingTop = "0px"; return; }
    var el = blockEl(comments[0].blockIndex);
    if (!el) return;
    var offset = el.getBoundingClientRect().top - railEl.getBoundingClientRect().top;
    railEl.style.paddingTop = Math.max(0, offset) + "px";
  }

  function updateActions() {
    var hasFeedback = comments.length > 0 || notesEl.value.trim().length > 0;
    rejectBtn.disabled = !hasFeedback;
    rejectBtn.title = hasFeedback ? "" : "Add a comment or a note first";
    // Notes ride along only on a denial: an allow decision has no message
    // channel back to Claude. Say so rather than dropping them silently.
    noticeEl.hidden = notesEl.value.trim().length === 0;
  }

  notesEl.addEventListener("input", updateActions);

  // ---------------- submit ----------------
  function send(verdict) {
    if (submitted) return;
    submitted = true;
    approveBtn.disabled = true;
    rejectBtn.disabled = true;

    var payload = {
      verdict: verdict,
      comments: comments.map(function (c) { return { quote: c.quote, body: c.body }; }),
      notes: notesEl.value.trim()
    };

    fetch("/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Plantor-Token": TOKEN },
      body: JSON.stringify(payload)
    }).then(function () {
      finish(verdict);
    }).catch(function () {
      finish(verdict);
    });
  }

  function finish(verdict) {
    var approved = verdict === "approve";
    document.getElementById("app").innerHTML =
      '<div class="done">' +
      '<div class="mark">' + (approved ? "✓" : "↺") + "</div>" +
      "<h2>" + (approved ? "Plan approved" : "Changes requested") + "</h2>" +
      "<p>" + (approved
        ? "Sent back to Claude. You can close this tab."
        : comments.length + (comments.length === 1 ? " comment" : " comments") +
          " sent back to Claude. You can close this tab.") +
      "</p></div>";
  }

  approveBtn.addEventListener("click", function () { send("approve"); });
  rejectBtn.addEventListener("click", function () { if (!rejectBtn.disabled) send("reject"); });

  // Deliberately NO single-key shortcuts for approve/reject. Submitting is
  // irreversible -- it goes straight back to Claude with no undo -- and a bare
  // "a" or "r" fires the moment focus is anywhere but a text field, which is
  // one stray keystroke away from approving a plan you meant to annotate.
  // Both verdicts require an explicit click.

  window.addEventListener("resize", function () { render(); });

  render();
})();
</script>
</body>
</html>
